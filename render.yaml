# Render Blueprint — https://render.com/docs/blueprint-spec
# In Render: New + → Blueprint → paste this repo's URL. Render creates the PostgreSQL
# database and the web service, wires DATABASE_URL between them and generates the JWT secrets.
# Deploys are driven by GitHub Actions (.github/workflows/deploy.yml) through the
# service's Deploy Hook, after the tests pass — not by Render auto-deploy.
services:
  - type: web
    name: heartlink-backend
    runtime: node
    plan: free
    region: singapore
    branch: main
    # TypeScript is a dev dependency, so install it for the build, then drop dev deps.
    buildCommand: npm ci --include=dev && npm run build && npm prune --omit=dev
    startCommand: node dist/server.js
    healthCheckPath: /api/health
    # GitHub Actions triggers deploys after tests pass
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Login token signing keys (random, generated once by Render)
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      # PostgreSQL connection string, filled in automatically from the database below
      - key: DATABASE_URL
        fromDatabase:
          name: heartlink-db
          property: connectionString
      # Allowed browser origins for the web app (comma-separated). The Android app
      # does not need this. Leave as-is until the web frontend is hosted.
      - key: CLIENT_URL
        value: http://localhost:5173
      # Demo users alice/bob/charlie (password Password123!). Set to "true" only for testing.
      - key: SEED_DEMO_DATA
        value: "false"
      # Optional: SMTP for password-reset emails (forgot password does not work without it)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

databases:
  - name: heartlink-db
    databaseName: heartlink
    user: heartlink
    plan: free
    region: singapore
    postgresMajorVersion: "17"
    # Only the web service connects (over Render's private network)
    ipAllowList: []
